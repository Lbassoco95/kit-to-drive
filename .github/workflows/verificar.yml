name: Verificar

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Traer main para comparar las migraciones contra lo ya guardado
        run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
